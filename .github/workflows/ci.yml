name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web2-echec/backend/package-lock.json
      - run: npm ci
        working-directory: web2-echec/backend
      - run: npm test
        working-directory: web2-echec/backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web2-echec/frontend/package-lock.json
      - run: npm ci
        working-directory: web2-echec/frontend
      - run: npm run lint
        working-directory: web2-echec/frontend
      - run: npm run build
        working-directory: web2-echec/frontend

  image:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          SHA=sha-${GITHUB_SHA::7}

          # Backend
          docker build -f web2-echec/backend/Dockerfile \
            -t ghcr.io/$OWNER/web2-echec-backend:latest \
            -t ghcr.io/$OWNER/web2-echec-backend:$SHA web2-echec/backend
          docker push ghcr.io/$OWNER/web2-echec-backend:latest
          docker push ghcr.io/$OWNER/web2-echec-backend:$SHA

          # Frontend
          docker build -f web2-echec/frontend/Dockerfile \
            -t ghcr.io/$OWNER/web2-echec-frontend:latest \
            -t ghcr.io/$OWNER/web2-echec-frontend:$SHA web2-echec/frontend
          docker push ghcr.io/$OWNER/web2-echec-frontend:latest
          docker push ghcr.io/$OWNER/web2-echec-frontend:$SHA