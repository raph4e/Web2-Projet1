name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web2-echec/backend/package-lock.json
      - run: npm ci
        working-directory: web2-echec/backend
      - run: npm test
        working-directory: web2-echec/backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web2-echec/frontend/package-lock.json
      - run: npm ci
        working-directory: web2-echec/frontend
      - run: npm run lint
        working-directory: web2-echec/frontend
      - run: npm run build
        working-directory: web2-echec/frontend

  image:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          SHA=sha-${GITHUB_SHA::7}

          docker build -f web2-echec/backend/Dockerfile \
            -t ghcr.io/$OWNER/web2-echec-backend:latest \
            -t ghcr.io/$OWNER/web2-echec-backend:$SHA web2-echec/backend
          docker push --all-tags ghcr.io/$OWNER/web2-echec-backend

          docker build -f web2-echec/frontend/Dockerfile \
            -t ghcr.io/$OWNER/web2-echec-frontend:latest \
            -t ghcr.io/$OWNER/web2-echec-frontend:$SHA web2-echec/frontend
          docker push --all-tags ghcr.io/$OWNER/web2-echec-frontend

          compose:
            name: Smoke test compose
            needs: image
            runs-on: ubuntu-latest
            permissions:
              contents: read
              packages: read
            steps:
              - uses: actions/checkout@v4
        
              - name: Connexion à ghcr.io
                run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        
              - name: Préparer le .env de test
                run: |
                  OWNER=${GITHUB_REPOSITORY_OWNER,,}
                  {
                    echo "BACKEND_IMAGE=ghcr.io/$OWNER/web2-echec-backend"
                    echo "BACKEND_TAG=sha-${GITHUB_SHA::7}"
                    echo "FRONTEND_IMAGE=ghcr.io/$OWNER/web2-echec-frontend"
                    echo "FRONTEND_TAG=sha-${GITHUB_SHA::7}"
                    echo "GITHUB_CLIENT_ID=ci-test"
                    echo "GITHUB_CLIENT_SECRET=ci-test"
                    echo "SESSION_SECRET=ci-test-secret"
                  } > web2-echec/.env
        
              - name: Démarrer les conteneurs
                run: docker compose -f web2-echec/docker-compose.yml --env-file web2-echec/.env up -d
        
              - name: Vérifier que le backend répond
                run: |
                  for i in $(seq 1 15); do
                    if curl -fs http://localhost:3000/; then exit 0; fi
                    sleep 2
                  done
                  docker compose -f web2-echec/docker-compose.yml --env-file web2-echec/.env logs
                  exit 1
        
              - name: Arrêter les conteneurs
                if: always()
                run: docker compose -f web2-echec/docker-compose.yml --env-file web2-echec/.env down -v